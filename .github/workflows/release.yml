name: Release patches

# Publish the patch bundle (.rvp) as a GitHub release: push a tag such as v0.1.0.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: read

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      GITHUB_ACTOR: ${{ github.actor }}
      GITHUB_TOKEN: ${{ secrets.GPR_TOKEN || secrets.GITHUB_TOKEN }}
      ORG_GRADLE_PROJECT_githubPackagesUsername: ${{ github.actor }}
      ORG_GRADLE_PROJECT_githubPackagesPassword: ${{ secrets.GPR_TOKEN || secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Build bundle
        run: |
          chmod +x gradlew
          ./gradlew buildAndroid --stacktrace
      - name: Publish release
        run: gh release create "$GITHUB_REF_NAME" patches/build/libs/*.rvp --title "$GITHUB_REF_NAME" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
